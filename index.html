<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShieldNet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.9.0/ethers.umd.min.js"></script>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-page: #f8f9fc;
  --glass-bg: rgba(255,255,255,0.6);
  --glass-border: rgba(255,255,255,0.8);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.06);
  --glass-blur: blur(20px);
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-tertiary: #94a3b8;
  --accent-violet: #7c3aed;
  --accent-violet-light: rgba(124,58,237,0.08);
  --accent-violet-medium: rgba(124,58,237,0.15);
  --accent-teal: #0d9488;
  --accent-teal-light: rgba(13,148,136,0.1);
  --danger: #ef4444;
  --danger-light: rgba(239,68,68,0.1);
  --input-bg: #f1f5f9;
  --input-border: #e2e8f0;
  --sev-info: #94a3b8;
  --sev-low: #3b82f6;
  --sev-medium: #f59e0b;
  --sev-high: #f97316;
  --sev-critical: #ef4444;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg-page);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
  font-weight: 400;
}

/* ===== ANIMATED GRADIENT BLOBS ===== */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  z-index: 0;
  pointer-events: none;
  will-change: transform;
}

.blob-1 {
  width: 400px;
  height: 400px;
  background: rgba(167,139,250,0.3);
  top: -80px;
  right: -60px;
  animation: blobDrift1 25s ease-in-out infinite;
}

.blob-2 {
  width: 350px;
  height: 350px;
  background: rgba(45,212,168,0.25);
  bottom: -60px;
  left: -80px;
  animation: blobDrift2 22s ease-in-out infinite;
}

.blob-3 {
  width: 300px;
  height: 300px;
  background: rgba(251,146,60,0.2);
  top: 40%;
  left: -40px;
  animation: blobDrift3 28s ease-in-out infinite;
}

.blob-4 {
  width: 250px;
  height: 250px;
  background: rgba(56,189,248,0.2);
  bottom: 10%;
  right: -30px;
  animation: blobDrift4 24s ease-in-out infinite;
}

@keyframes blobDrift1 {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-40px, 30px); }
  50% { transform: translate(-20px, 60px); }
  75% { transform: translate(30px, 20px); }
}

@keyframes blobDrift2 {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(50px, -20px); }
  50% { transform: translate(30px, -50px); }
  75% { transform: translate(-20px, -30px); }
}

@keyframes blobDrift3 {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(40px, -40px); }
  66% { transform: translate(60px, 20px); }
}

@keyframes blobDrift4 {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-30px, -40px); }
  50% { transform: translate(-50px, 10px); }
  75% { transform: translate(-10px, -20px); }
}

/* ===== FADE IN ANIMATION ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in {
  animation: fadeInUp 0.6s ease forwards;
}

.fade-in-delay-1 { animation-delay: 0.1s; opacity: 0; }
.fade-in-delay-2 { animation-delay: 0.2s; opacity: 0; }
.fade-in-delay-3 { animation-delay: 0.3s; opacity: 0; }
.fade-in-delay-4 { animation-delay: 0.4s; opacity: 0; }

/* ===== LAYOUT ===== */
.app-container {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* ===== TOP BAR ===== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  margin: 12px -24px 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-bottom: 1px solid rgba(255,255,255,0.9);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-wrap: wrap;
  gap: 12px;
}

.logo-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 28px;
  height: 28px;
}

.logo-text {
  font-family: var(--font);
  font-weight: 600;
  font-size: 1.2rem;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

.top-bar-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.network-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-secondary);
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.5);
  border: 1px solid var(--input-border);
}

.network-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-teal);
  display: inline-block;
}

.network-dot.disconnected { background: var(--text-tertiary); }

.contract-link {
  font-family: var(--font);
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--text-secondary);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: color 0.2s;
}

.contract-link:hover { color: var(--accent-violet); }

.btn-connect {
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 600;
  color: #fff;
  background: var(--accent-violet);
  border: none;
  padding: 8px 20px;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s;
  letter-spacing: -0.01em;
}

.btn-connect:hover {
  transform: scale(1.02);
  box-shadow: 0 4px 16px rgba(124,58,237,0.3);
}

.btn-connect.connected {
  background: var(--accent-teal);
}

.btn-connect.connected:hover {
  box-shadow: 0 4px 16px rgba(13,148,136,0.3);
}

/* ===== HERO ===== */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 56px 0 16px;
  text-align: center;
}

.hero-title {
  font-family: var(--font);
  font-weight: 700;
  font-size: 2.4rem;
  color: var(--text-primary);
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin-bottom: 10px;
}

.hero-subtitle {
  font-family: var(--font);
  font-weight: 300;
  font-size: 1.1rem;
  color: var(--text-secondary);
  margin-bottom: 40px;
  letter-spacing: -0.01em;
}

/* ===== STATS GRID ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  width: 100%;
  margin-bottom: 40px;
}

.stat-card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  text-align: center;
  box-shadow: var(--glass-shadow);
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}

.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.08);
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
}

.stat-card:nth-child(1)::before { background: rgba(167,139,250,0.6); }
.stat-card:nth-child(2)::before { background: rgba(45,212,168,0.6); }
.stat-card:nth-child(3)::before { background: rgba(251,146,60,0.5); }
.stat-card:nth-child(4)::before { background: rgba(56,189,248,0.6); }

.stat-label {
  font-family: var(--font);
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}

.stat-value {
  font-family: var(--font);
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

/* ===== GLASS CARD ===== */
.glass-card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--glass-shadow);
  padding: 28px;
  margin-bottom: 20px;
  transition: transform 0.2s, box-shadow 0.2s;
}

.glass-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.08);
}

/* ===== POST BOUNTY CARD ===== */
.post-bounty-card {
  margin-bottom: 32px;
}

.card-heading {
  font-family: var(--font);
  font-weight: 600;
  font-size: 1.15rem;
  color: var(--text-primary);
  margin-bottom: 24px;
  letter-spacing: -0.01em;
}

.form-group { margin-bottom: 18px; }

.form-label {
  display: block;
  font-family: var(--font);
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.form-input, .form-textarea {
  width: 100%;
  background: var(--input-bg);
  border: 1.5px solid transparent;
  border-radius: var(--radius);
  padding: 11px 16px;
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 0.9rem;
  font-weight: 400;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.form-input::placeholder, .form-textarea::placeholder {
  color: var(--text-tertiary);
  font-weight: 300;
}

.form-input:focus, .form-textarea:focus {
  border-color: var(--accent-violet);
  box-shadow: 0 0 0 3px rgba(124,58,237,0.08);
}

.form-textarea { resize: vertical; min-height: 80px; }

.input-suffix-wrap {
  position: relative;
}

.input-suffix-wrap .form-input {
  padding-right: 60px;
}

.input-suffix {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-tertiary);
  pointer-events: none;
}

.btn-primary {
  font-family: var(--font);
  font-size: 0.88rem;
  font-weight: 600;
  color: #fff;
  background: linear-gradient(135deg, var(--accent-violet), #6d28d9);
  border: none;
  padding: 12px 32px;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s;
  letter-spacing: -0.01em;
  box-shadow: 0 4px 14px rgba(124,58,237,0.25);
}

.btn-primary:hover {
  transform: scale(1.02);
  box-shadow: 0 6px 20px rgba(124,58,237,0.35);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* ===== SECTION HEADING ===== */
.section-heading {
  font-family: var(--font);
  font-weight: 600;
  font-size: 1.15rem;
  color: var(--text-primary);
  margin-bottom: 16px;
  letter-spacing: -0.01em;
}

/* ===== BOUNTY LIST ===== */
.bounty-list { display: flex; flex-direction: column; gap: 14px; }

.bounty-card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--glass-shadow);
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}

.bounty-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.08);
}

.bounty-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  cursor: pointer;
  flex-wrap: wrap;
  gap: 12px;
}

.bounty-header-left {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.bounty-id {
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent-violet);
}

.bounty-target {
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 0.78rem;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}

.bounty-target-link {
  color: var(--accent-violet);
  text-decoration: none;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 0.72rem;
  font-weight: 500;
  transition: opacity 0.15s;
}

.bounty-target-link:hover { opacity: 0.7; }

.copy-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-tertiary);
  padding: 2px;
  display: flex;
  align-items: center;
  transition: color 0.15s;
}

.copy-btn:hover { color: var(--accent-violet); }

.bounty-header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.bounty-pool {
  font-family: var(--font);
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.bounty-pool-unit {
  font-weight: 400;
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-left: 3px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  font-family: var(--font);
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 4px 12px;
  border-radius: var(--radius-full);
}

.status-pill.active {
  background: rgba(13,148,136,0.12);
  color: var(--accent-teal);
}

.status-pill.closed {
  background: rgba(148,163,184,0.15);
  color: var(--text-tertiary);
}

/* ===== BOUNTY DETAILS ===== */
.bounty-details {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}

.bounty-details.open { max-height: 4000px; }

.bounty-details-inner {
  padding: 0 24px 24px;
  border-top: 1px solid rgba(226,232,240,0.6);
}

.bounty-meta {
  display: flex;
  gap: 24px;
  margin: 16px 0;
  font-family: var(--font);
  font-size: 0.78rem;
  font-weight: 400;
  color: var(--text-secondary);
  flex-wrap: wrap;
}

.bounty-scope-label {
  font-family: var(--font);
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
}

.bounty-scope {
  margin: 4px 0 16px;
  font-size: 0.9rem;
  font-weight: 400;
  color: var(--text-primary);
  line-height: 1.6;
}

/* ===== FINDINGS ===== */
.findings-section { margin-top: 12px; }

.findings-title {
  font-family: var(--font);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.finding-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(241,245,249,0.6);
  border: 1px solid rgba(226,232,240,0.5);
  border-radius: var(--radius);
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 8px;
  transition: background 0.15s;
}

.finding-row:hover { background: rgba(241,245,249,0.9); }

.finding-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.severity-badge {
  font-family: var(--font);
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.severity-0 { background: rgba(148,163,184,0.15); color: var(--sev-info); }
.severity-1 { background: rgba(59,130,246,0.12); color: var(--sev-low); }
.severity-2 { background: rgba(245,158,11,0.15); color: #92400e; }
.severity-3 { background: rgba(249,115,22,0.15); color: #fff; background-color: var(--sev-high); }
.severity-4 { background: var(--sev-critical); color: #fff; }

.finding-title-text {
  font-size: 0.88rem;
  font-weight: 400;
  color: var(--text-primary);
}

.finding-auditor {
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 0.68rem;
  color: var(--text-tertiary);
}

.finding-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.finding-status {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font);
  font-size: 0.72rem;
  font-weight: 500;
}

.finding-status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}

.finding-status.pending { color: #d97706; }
.finding-status.pending .finding-status-dot { background: #f59e0b; }
.finding-status.approved { color: var(--accent-teal); }
.finding-status.approved .finding-status-dot { background: var(--accent-teal); }
.finding-status.rejected { color: var(--danger); }
.finding-status.rejected .finding-status-dot { background: var(--danger); }

.finding-reward {
  font-family: var(--font);
  font-size: 0.78rem;
  color: var(--text-primary);
  font-weight: 600;
}

/* ===== SMALL BUTTONS ===== */
.btn-sm {
  font-family: var(--font);
  font-size: 0.72rem;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: var(--radius-full);
  border: none;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.15s;
}

.btn-sm:hover { transform: scale(1.02); }

.btn-approve {
  background: rgba(13,148,136,0.1);
  color: var(--accent-teal);
}

.btn-approve:hover { box-shadow: 0 2px 8px rgba(13,148,136,0.2); }

.btn-reject {
  background: var(--danger-light);
  color: var(--danger);
}

.btn-reject:hover { box-shadow: 0 2px 8px rgba(239,68,68,0.15); }

.btn-claim {
  background: var(--accent-violet-light);
  color: var(--accent-violet);
}

.btn-claim:hover { box-shadow: 0 2px 8px rgba(124,58,237,0.2); }

.btn-close-bounty {
  background: rgba(148,163,184,0.12);
  color: var(--text-secondary);
  margin-top: 14px;
}

.btn-close-bounty:hover {
  color: var(--danger);
  background: var(--danger-light);
}

/* ===== SUBMIT FINDING FORM ===== */
.submit-finding-form {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid rgba(226,232,240,0.5);
}

.sf-title {
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 16px;
}

.severity-selector {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.sev-btn {
  font-family: var(--font);
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  padding: 6px 16px;
  border-radius: var(--radius-full);
  cursor: pointer;
  background: transparent;
  transition: all 0.2s;
  letter-spacing: 0.03em;
}

.sev-btn[data-sev="0"] { color: var(--sev-info); border: 1.5px solid var(--sev-info); }
.sev-btn[data-sev="1"] { color: var(--sev-low); border: 1.5px solid var(--sev-low); }
.sev-btn[data-sev="2"] { color: #92400e; border: 1.5px solid var(--sev-medium); }
.sev-btn[data-sev="3"] { color: var(--sev-high); border: 1.5px solid var(--sev-high); }
.sev-btn[data-sev="4"] { color: var(--sev-critical); border: 1.5px solid var(--sev-critical); }

.sev-btn.selected { color: #fff; }
.sev-btn.selected[data-sev="0"] { background: var(--sev-info); border-color: var(--sev-info); }
.sev-btn.selected[data-sev="1"] { background: var(--sev-low); border-color: var(--sev-low); }
.sev-btn.selected[data-sev="2"] { background: var(--sev-medium); border-color: var(--sev-medium); color: #fff; }
.sev-btn.selected[data-sev="3"] { background: var(--sev-high); border-color: var(--sev-high); }
.sev-btn.selected[data-sev="4"] { background: var(--sev-critical); border-color: var(--sev-critical); }

/* ===== APPROVE MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.3);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-overlay[hidden] { display: none !important; }

.modal-box {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 32px;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.12);
}

.modal-title {
  font-family: var(--font);
  font-weight: 600;
  font-size: 1.05rem;
  color: var(--text-primary);
  margin-bottom: 20px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.btn-cancel {
  font-family: var(--font);
  font-size: 0.85rem;
  font-weight: 500;
  padding: 10px 24px;
  border-radius: var(--radius-full);
  border: 1px solid var(--input-border);
  color: var(--text-secondary);
  background: transparent;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-cancel:hover { background: var(--input-bg); }

/* ===== TOAST ===== */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 500;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-full);
  padding: 12px 20px;
  color: var(--text-primary);
  max-width: 380px;
  animation: toastIn 0.3s ease;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
}

.toast-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.toast.success .toast-dot { background: var(--accent-teal); }
.toast.error .toast-dot { background: var(--danger); }
.toast.info .toast-dot { background: var(--sev-low); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 48px 20px;
}

.empty-state-text {
  font-family: var(--font);
  font-style: italic;
  font-weight: 300;
  font-size: 0.95rem;
  color: var(--text-tertiary);
}

/* ===== SPINNER ===== */
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(124,58,237,0.2);
  border-top-color: var(--accent-violet);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ===== EXPAND ARROW ===== */
.expand-arrow {
  color: var(--text-tertiary);
  transition: transform 0.3s;
  flex-shrink: 0;
}

.bounty-card.expanded .expand-arrow {
  transform: rotate(180deg);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .hero-title { font-size: 1.8rem; }
  .hero-subtitle { font-size: 0.95rem; }
  .bounty-header { flex-direction: column; align-items: flex-start; }
  .bounty-header-right { width: 100%; justify-content: space-between; }
  .finding-row { flex-direction: column; align-items: flex-start; }
  .finding-right { width: 100%; justify-content: flex-start; margin-top: 4px; }
  .app-container { padding: 0 16px 60px; }
  .top-bar { margin: 0 -16px; padding: 14px 16px; }
}

@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .top-bar { flex-direction: column; align-items: flex-start; }
  .stat-value { font-size: 1.5rem; }
  .stat-card { padding: 18px 14px; }
  .hero { padding: 36px 0 12px; }
  .hero-title { font-size: 1.5rem; }
  .glass-card { padding: 20px; }
  .bounty-header { padding: 16px 18px; }
  .bounty-details-inner { padding: 0 18px 18px; }
}
</style>
</head>
<body>

<!-- ANIMATED GRADIENT BLOBS -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div class="blob blob-4"></div>

<div class="toast-container" id="toastContainer"></div>

<!-- APPROVE MODAL -->
<div class="modal-overlay" id="approveModal" hidden>
  <div class="modal-box">
    <div class="modal-title">Approve Finding</div>
    <div class="form-group">
      <label class="form-label">Reward Amount (BOT)</label>
      <div class="input-suffix-wrap">
        <input type="number" class="form-input" id="approveRewardInput" step="0.001" min="0" placeholder="0.5">
        <span class="input-suffix">BOT</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="approveConfirmBtn">Approve</button>
      <button class="btn-cancel" id="approveCancelBtn">Cancel</button>
    </div>

</div>

<div class="app-container">

  <!-- TOP BAR -->
  <div class="top-bar fade-in">
    <div class="logo-group">
      <svg class="logo-icon" viewBox="0 0 28 28" fill="none">
        <path d="M14 2L24 7.5V18.5L14 24L4 18.5V7.5L14 2Z" stroke="#1e293b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
        <path d="M14 6L21 10V18L14 22L7 18V10L14 6Z" stroke="#7c3aed" stroke-width="1.2" fill="none" stroke-linejoin="round" opacity="0.5"/>
        <path d="M10 14L13 17L18 11" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">ShieldNet</span>
    </div>
    <div class="top-bar-right">
      <div class="network-badge">
        <span class="network-dot disconnected" id="networkDot"></span>
        <span id="networkName">Not Connected</span>
      </div>
      <a class="contract-link" id="contractLink" href="#" target="_blank" rel="noopener">
        <span id="contractDisplay">---</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.5 1.5H2.5A1 1 0 001.5 2.5v7a1 1 0 001 1h7a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M7 1.5h3.5V5M5.5 6.5l5-5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <!-- HERO -->

  <!-- STATS -->
  <div class="stats-grid fade-in fade-in-delay-2">

    </div>
    <div class="stat-card">
      <div class="stat-label">Active</div>
      <div class="stat-value" id="statActive">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Paid</div>
      <div class="stat-value" id="statPaid">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Findings</div>
      <div class="stat-value" id="statFindings">--</div>
    </div>
  </div>

  <!-- POST BOUNTY -->
  <div class="glass-card post-bounty-card fade-in fade-in-delay-3">
    <div class="card-heading">Post New Bounty</div>
    <div class="form-group">
      <label class="form-label">Target</label>
      <input type="text" class="form-input" id="inputTarget" placeholder="Contract address or repository URL">
    </div>
    <div class="form-group">
      <label class="form-label">Scope</label>
      <textarea class="form-textarea" id="inputScope" placeholder="Describe the scope and what should be audited..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Reward Pool</label>
      <div class="input-suffix-wrap">
        <input type="number" class="form-input" id="inputPool" step="0.01" min="0" placeholder="1.0">
        <span class="input-suffix">BOT</span>
      </div>
    </div>
    <button class="btn-primary" id="btnPostBounty">Post Bounty</button>
  </div>

  <!-- BOUNTIES LIST -->
  <div class="section-heading fade-in fade-in-delay-4">Bounties</div>
  <div class="bounty-list" id="bountyList">
    <div class="glass-card empty-state" id="emptyState">
      <span class="empty-state-text">No bounties posted yet</span>
    </div>
  </div>

</div>

<script>
/* ===================================================================
   ShieldNet DApp -- Frontend Logic (Glassmorphism Light)
   =================================================================== */

// ---------- CONFIG ----------
const CONTRACT_ADDRESS = '0x0000000000000000000000000000000000000000';
const ZERO_ADDRESS = '0x0000000000000000000000000000000000000000';
const BOTCHAIN_TESTNET = {
  chainId: '0x3C8',
  chainName: 'BOT Chain Testnet',
  rpcUrls: ['https://rpc.bohr.life'],
  nativeCurrency: { name: 'BOT', symbol: 'BOT', decimals: 18 },
  blockExplorerUrls: ['https://scan.bohr.life']
};
const SEVERITY_LABELS = ['INFO', 'LOW', 'MEDIUM', 'HIGH', 'CRITICAL'];
const FINDING_STATUS = ['Pending', 'Approved', 'Rejected'];

const CONTRACT_ABI = [
  "function postBounty(string target, string scope) external payable",
  "function submitFinding(uint256 bountyId, string title, uint8 severity, string details) external",
  "function approveFinding(uint256 bountyId, uint256 findingIndex, uint256 reward) external",
  "function rejectFinding(uint256 bountyId, uint256 findingIndex) external",
  "function claimReward(uint256 bountyId, uint256 findingIndex) external",
  "function closeBounty(uint256 bountyId) external",
  "function getBounty(uint256 bountyId) external view returns (tuple(uint256 id, string target, string scope, address poster, uint256 pool, uint256 paid, bool active, uint256 createdAt))",
  "function getFindings(uint256 bountyId) external view returns (tuple(address auditor, string title, uint8 severity, string details, uint8 status, uint256 reward, bool claimed, uint256 submittedAt)[])",
  "function getBountyCount() external view returns (uint256)",
  "function pause() external",
  "function unpause() external",
  "event BountyPosted(uint256 indexed id, address indexed poster, string target, uint256 pool)",
  "event FindingSubmitted(uint256 indexed bountyId, uint256 findingIndex, address indexed auditor, uint8 severity)",
  "event FindingApproved(uint256 indexed bountyId, uint256 findingIndex, uint256 reward)",
  "event FindingRejected(uint256 indexed bountyId, uint256 findingIndex)",
  "event RewardClaimed(uint256 indexed bountyId, uint256 findingIndex, address indexed auditor, uint256 reward)",
  "event BountyClosed(uint256 indexed id, uint256 refunded)"
];

// ---------- STATE ----------
let provider = null;
let signer = null;
let contract = null;
let userAddress = null;
let isDeployed = false;

// ---------- DOM ----------
const $ = (sel) => document.querySelector(sel);
const $all = (sel) => document.querySelectorAll(sel);

// ---------- TOAST ----------
function toast(msg, type) {
  type = type || 'info';
  const container = $('#toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<span class="toast-dot"></span>' + escapeHtml(msg);
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 4000);
}

// ---------- UTILITIES ----------
function shortAddr(addr) {
  if (!addr) return '---';
  return addr.slice(0, 6) + '...' + addr.slice(-4);
}

function timeAgo(ts) {
  const secs = Math.floor(Date.now() / 1000) - Number(ts);
  if (secs < 60) return secs + 's ago';
  if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
  if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
  return Math.floor(secs / 86400) + 'd ago';
}

function formatBOT(wei) {
  try { return parseFloat(ethers.formatEther(wei)).toFixed(4); } catch(e) { return '0'; }
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard', 'success')).catch(() => {});
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- CONTRACT CHECK ----------
function checkDeployed() {
  isDeployed = CONTRACT_ADDRESS !== ZERO_ADDRESS;
  if (isDeployed) {
    $('#contractDisplay').textContent = shortAddr(CONTRACT_ADDRESS);
    $('#contractLink').href = BOTCHAIN_TESTNET.blockExplorerUrls[0] + '/address/' + CONTRACT_ADDRESS;
  } else {
    $('#contractDisplay').textContent = 'Not Deployed';
    $('#contractLink').removeAttribute('href');
  }
}

// ---------- WALLET ----------
async function connectWallet() {
  if (!window.ethereum) {
    toast('MetaMask not detected', 'error');
    return;
  }
  try {
    provider = new ethers.BrowserProvider(window.ethereum);
    const accounts = await provider.send('eth_requestAccounts', []);
    userAddress = accounts[0];
    signer = await provider.getSigner();

    // Switch to BOT Chain
    try {
      await window.ethereum.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: BOTCHAIN_TESTNET.chainId }]
      });
    } catch (switchErr) {
      if (switchErr.code === 4902) {
        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [BOTCHAIN_TESTNET]
        });
      }
    }

    if (isDeployed) {
      contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
    }

    $('#btnConnect').textContent = shortAddr(userAddress);
    $('#btnConnect').classList.add('connected');
    $('#networkDot').classList.remove('disconnected');
    $('#networkName').textContent = 'BotChain';

    toast('Wallet connected', 'success');
    loadBounties();
  } catch (err) {
    toast('Connection failed: ' + (err.message || err), 'error');
  }
}

// ---------- LOAD BOUNTIES ----------
async function loadBounties() {
  if (!isDeployed) return;
  if (!contract) return;
  try {
    const count = await contract.getBountyCount();
    const total = Number(count);
    let active = 0;
    let totalPaid = 0n;
    let totalFindings = 0;
    const bounties = [];

    for (let i = 0; i < total; i++) {
      const b = await contract.getBounty(i);
      const findings = await contract.getFindings(i);
      bounties.push({ bounty: b, findings: findings, id: i });
      if (b.active) active++;
      totalPaid += b.paid;
      totalFindings += findings.length;
    }

    $('#statTotal').textContent = total;
    $('#statActive').textContent = active;
    $('#statPaid').textContent = formatBOT(totalPaid) + ' BOT';
    $('#statFindings').textContent = totalFindings;

    renderBounties(bounties);
  } catch (err) {
    toast('Failed to load bounties: ' + (err.reason || err.message || err), 'error');
  }
}

// ---------- RENDER BOUNTIES ----------
function renderBounties(bounties) {
  const list = $('#bountyList');
  list.innerHTML = '';

  if (bounties.length === 0) {
    list.innerHTML = '<div class="glass-card empty-state"><span class="empty-state-text">No bounties posted yet</span></div>';
    return;
  }

  bounties.reverse().forEach(({ bounty: b, findings, id }) => {
    const card = document.createElement('div');
    card.className = 'bounty-card';
    const statusClass = b.active ? 'active' : 'closed';
    const statusLabel = b.active ? 'Active' : 'Closed';
    const bountyIdStr = '#' + String(id).padStart(4, '0');

    let findingsHTML = '';
    findings.forEach((f, fi) => {
      const sevClass = 'severity-' + f.severity;
      const sevLabel = SEVERITY_LABELS[f.severity] || 'UNKNOWN';
      const fStatus = Number(f.status);
      let statusHTML = '';
      let actionsHTML = '';

      if (fStatus === 0) {
        statusHTML = '<span class="finding-status pending"><span class="finding-status-dot"></span> Pending</span>';
        if (userAddress && b.poster.toLowerCase() === userAddress.toLowerCase()) {
          actionsHTML = '<button class="btn-sm btn-approve" onclick="openApproveModal(' + id + ',' + fi + ')">Approve</button><button class="btn-sm btn-reject" onclick="rejectFinding(' + id + ',' + fi + ')">Reject</button>';
        }
      } else if (fStatus === 1) {
        statusHTML = '<span class="finding-status approved"><span class="finding-status-dot"></span> Approved</span><span class="finding-reward">' + formatBOT(f.reward) + ' BOT</span>';
        if (userAddress && f.auditor.toLowerCase() === userAddress.toLowerCase() && !f.claimed) {
          actionsHTML = '<button class="btn-sm btn-claim" onclick="claimReward(' + id + ',' + fi + ')">Claim</button>';
        }
        if (f.claimed) {
          actionsHTML = '<span class="finding-status approved" style="font-size:0.65rem">Claimed</span>';
        }
      } else {
        statusHTML = '<span class="finding-status rejected"><span class="finding-status-dot"></span> Rejected</span>';
      }

      findingsHTML += '<div class="finding-row"><div class="finding-left"><span class="severity-badge ' + sevClass + '">' + sevLabel + '</span><span class="finding-title-text">' + escapeHtml(f.title) + '</span><span class="finding-auditor">' + shortAddr(f.auditor) + '</span></div><div class="finding-right">' + statusHTML + actionsHTML + '</div></div>';
    });

    let closeBtnHTML = '';
    if (b.active && userAddress && b.poster.toLowerCase() === userAddress.toLowerCase()) {
      closeBtnHTML = '<button class="btn-sm btn-close-bounty" onclick="closeBounty(' + id + ')">Close Bounty</button>';
    }

    const targetDisplay = b.target.startsWith('0x') ? shortAddr(b.target) : (b.target.length > 40 ? b.target.slice(0, 37) + '...' : b.target);

    card.innerHTML =
      '<div class="bounty-header" onclick="toggleBounty(this)">' +
        '<div class="bounty-header-left">' +
          '<span class="bounty-id">' + bountyIdStr + '</span>' +
          '<span class="bounty-target">' + escapeHtml(targetDisplay) +
            '<button class="copy-btn" onclick="event.stopPropagation();copyToClipboard(\'' + escapeHtml(b.target) + '\')" title="Copy target">' +
              '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="3.5" y="3.5" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M2.5 8.5V3A1.5 1.5 0 014 1.5h5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>' +
            '</button>' +
          '</span>' +
        '</div>' +
        '<div class="bounty-header-right">' +
          '<span class="bounty-pool">' + formatBOT(b.pool) + '<span class="bounty-pool-unit">BOT</span></span>' +
          '<span class="status-pill ' + statusClass + '">' + statusLabel + '</span>' +
          '<svg class="expand-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</div>' +
      '</div>' +
      '<div class="bounty-details">' +
        '<div class="bounty-details-inner">' +
          '<div class="bounty-meta">' +
            '<span>Posted by ' + shortAddr(b.poster) + '</span>' +
            '<span>' + timeAgo(b.createdAt) + '</span>' +
            '<span>Paid: ' + formatBOT(b.paid) + ' / ' + formatBOT(b.pool) + ' BOT</span>' +
          '</div>' +
          '<div class="bounty-scope-label">Scope</div>' +
          '<div class="bounty-scope">' + escapeHtml(b.scope) + '</div>' +
          '<div class="findings-section">' +
            '<div class="findings-title">Findings (' + findings.length + ')</div>' +
            (findingsHTML || '<div style="color:var(--text-tertiary);font-size:0.85rem;font-style:italic;font-weight:300">No findings yet</div>') +
          '</div>' +
          closeBtnHTML +
          (b.active ? renderSubmitFindingForm(id) : '') +
        '</div>' +
      '</div>';

    list.appendChild(card);
  });
}

function renderSubmitFindingForm(bountyId) {
  return '<div class="submit-finding-form">' +
    '<div class="sf-title">Submit Finding</div>' +
    '<div class="form-group">' +
      '<label class="form-label">Title</label>' +
      '<input type="text" class="form-input" id="sfTitle_' + bountyId + '" placeholder="Brief vulnerability title">' +
    '</div>' +
    '<div class="form-group">' +
      '<label class="form-label">Severity</label>' +
      '<div class="severity-selector" id="sfSev_' + bountyId + '">' +
        '<button class="sev-btn" data-sev="0" onclick="selectSeverity(this,' + bountyId + ')">Info</button>' +
        '<button class="sev-btn" data-sev="1" onclick="selectSeverity(this,' + bountyId + ')">Low</button>' +
        '<button class="sev-btn" data-sev="2" onclick="selectSeverity(this,' + bountyId + ')">Medium</button>' +
        '<button class="sev-btn" data-sev="3" onclick="selectSeverity(this,' + bountyId + ')">High</button>' +
        '<button class="sev-btn" data-sev="4" onclick="selectSeverity(this,' + bountyId + ')">Critical</button>' +
      '</div>' +
    '</div>' +
    '<div class="form-group">' +
      '<label class="form-label">Details</label>' +
      '<textarea class="form-textarea" id="sfDetails_' + bountyId + '" placeholder="Detailed description, proof of concept, impact assessment..."></textarea>' +
    '</div>' +
    '<button class="btn-primary" onclick="submitFinding(' + bountyId + ')">Submit Finding</button>' +
  '</div>';
}

// ---------- UI INTERACTIONS ----------
function toggleBounty(headerEl) {
  const card = headerEl.closest('.bounty-card');
  const details = headerEl.nextElementSibling;
  card.classList.toggle('expanded');
  details.classList.toggle('open');
}

const selectedSeverity = {};
function selectSeverity(btn, bountyId) {
  const container = btn.parentElement;
  container.querySelectorAll('.sev-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedSeverity[bountyId] = parseInt(btn.dataset.sev);
}

// ---------- CONTRACT INTERACTIONS ----------
function requireContract() {
  if (!isDeployed) { toast('Contract not deployed', 'error'); return false; }
  if (!contract) { toast('Connect wallet first', 'error'); return false; }
  return true;
}

// Post Bounty
$('#btnPostBounty').addEventListener('click', async function() {
  if (!requireContract()) return;
  const target = $('#inputTarget').value.trim();
  const scope = $('#inputScope').value.trim();
  const pool = $('#inputPool').value.trim();
  if (!target || !scope || !pool || parseFloat(pool) <= 0) {
    toast('Please fill all fields with valid values', 'error');
    return;
  }
  try {
    this.disabled = true;
    this.innerHTML = '<span class="spinner"></span> Posting...';
    const tx = await contract.postBounty(target, scope, { value: ethers.parseEther(pool) });
    toast('Transaction sent...', 'info');
    await tx.wait();
    toast('Bounty posted successfully', 'success');
    $('#inputTarget').value = '';
    $('#inputScope').value = '';
    $('#inputPool').value = '';
    loadBounties();
  } catch (err) {
    toast('Error: ' + (err.reason || err.message || err), 'error');
  } finally {
    this.disabled = false;
    this.textContent = 'Post Bounty';
  }
});

// Submit Finding
async function submitFinding(bountyId) {
  if (!requireContract()) return;
  const title = $('#sfTitle_' + bountyId).value.trim();
  const details = $('#sfDetails_' + bountyId).value.trim();
  const sev = selectedSeverity[bountyId];
  if (!title || !details || sev === undefined) {
    toast('Please fill all fields and select severity', 'error');
    return;
  }
  try {
    const tx = await contract.submitFinding(bountyId, title, sev, details);
    toast('Submitting finding...', 'info');
    await tx.wait();
    toast('Finding submitted successfully', 'success');
    loadBounties();
  } catch (err) {
    toast('Error: ' + (err.reason || err.message || err), 'error');
  }
}

// Approve Finding -- modal
let pendingApprove = null;
function openApproveModal(bountyId, findingIndex) {
  pendingApprove = { bountyId, findingIndex };
  $('#approveRewardInput').value = '';
  $('#approveModal').hidden = false;
}

$('#approveCancelBtn').addEventListener('click', function() {
  $('#approveModal').hidden = true;
  pendingApprove = null;
});

$('#approveConfirmBtn').addEventListener('click', async function() {
  if (!requireContract() || !pendingApprove) return;
  const rewardVal = $('#approveRewardInput').value.trim();
  if (!rewardVal || parseFloat(rewardVal) <= 0) {
    toast('Enter a valid reward amount', 'error');
    return;
  }
  try {
    this.disabled = true;
    this.innerHTML = '<span class="spinner"></span>';
    const tx = await contract.approveFinding(
      pendingApprove.bountyId,
      pendingApprove.findingIndex,
      ethers.parseEther(rewardVal)
    );
    toast('Approving finding...', 'info');
    await tx.wait();
    toast('Finding approved', 'success');
    $('#approveModal').hidden = true;
    pendingApprove = null;
    loadBounties();
  } catch (err) {
    toast('Error: ' + (err.reason || err.message || err), 'error');
  } finally {
    this.disabled = false;
    this.textContent = 'Approve';
  }
});

// ---------- WALLET EVENTS ----------
if (window.ethereum) {
  window.ethereum.on('accountsChanged', function(accounts) {
    if (accounts.length === 0) {
      userAddress = null;
      contract = null;
      signer = null;
      $('#btnConnect').textContent = 'Connect Wallet';
      $('#btnConnect').classList.remove('connected');
      $('#networkDot').classList.add('disconnected');
      $('#networkName').textContent = 'Not Connected';
    } else {
      connectWallet();
    }
  });
  window.ethereum.on('chainChanged', function() {
    window.location.reload();
  });
}

// ---------- CONNECT BUTTON ----------
$('#btnConnect').addEventListener('click', connectWallet);

// ---------- INIT ----------
checkDeployed();
</script>
